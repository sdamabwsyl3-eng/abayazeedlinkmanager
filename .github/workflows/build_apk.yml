l.H); await SunmiPrinter.printText('User: ${voucher.username} | PIN: ${voucher.pin}\n'); await SunmiPrinter.lineWrap(2); await SunmiPrinter.cut(); await SunmiPrinter.exitTransactionPrint(true); return true; } catch (e) { await SunmiPrinter.exitTransactionPrint(false); return false; } } } ``` --- ### 6. شاشة لوحة العمليات: `lib/features/dashboard/presentation/dashboard_screen.dart` ```dart import 'package:flutter/material.dart'; import '../../../core/theme/app_colors.dart'; import '../../../core/utils/sunmi_printer_service.dart'; class DashboardScreen extends StatelessWidget { const DashboardScreen({super.key}); @override Widget build(BuildContext context) { return Scaffold( appBar: AppBar( backgroundColor: AppColors.surface, title: Row( children: const [ Icon(Icons.hub, color: AppColors.primaryCyan), SizedBox(width: 8), Text('أبايذيد لنك منجر — Starlink & MikroTik'), ], ), ), body: Directionality( textDirection: TextDirection.rtl, child: ListView( padding: const EdgeInsets.all(16), children: [ Card( color: AppColors.surface, child: Padding( padding: const EdgeInsets.all(16), child: Row( mainAxisAlignment: MainAxisAlignment.spaceAround, children: const [ Text('التحميل: 218.4 Mbps', style: TextStyle(color: AppColors.primaryCyan, fontWeight: FontWeight.bold)), Text('الرفع: 34.2 Mbps', style: TextStyle(color: AppColors.accentGreen, fontWeight: FontWeight.bold)), Text('Ping: 28 ms', style: TextStyle(color: AppColors.warningOrange, fontWeight: FontWeight.bold)), ], ), ), ), const SizedBox(height: 16), ElevatedButton.icon( style: ElevatedButton.styleFrom( backgroundColor: AppColors.primaryCyan, foregroundColor: Colors.black, minimumSize: const Size.fromHeight(50), ), icon: const Icon(Icons.print), label: const Text('طباعة كرت تجريبي (Sunmi / محاكي)', style: TextStyle(fontWeight: FontWeight.bold)), onPressed: () { SunmiPrinterService.printVoucher( context, SunmiVoucherData( username: 'AY-7840-2911', pin: '491028', packageName: '24 ساعة توربو', price: 2500, validity: '24 ساع