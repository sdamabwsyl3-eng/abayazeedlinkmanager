كيف أربط التطبيق بـ WinBox و MikroTik بعد التثبيت؟


🔌 خطوات ربط تطبيق «أبايذيد لنك منجر» براوتر MikroTik و WinBox بعد التثبيت
تتم عملية الربط بين التطبيق والراوتر عبر واجهة MikroTik RouterOS REST API الرسمية، بينما يُستخدم برنامج WinBox لإعداد وتجهيز الصلاحيات ومراقبة النتائج لحظياً.

إليك الخطوات العملية المباشرة خطوة بخطوة:

1️⃣ إعداد راوتر MikroTik عبر برنامج WinBox (على الكمبيوتر)
افتح برنامج WinBox، وسجّل الدخول إلى راوتر MikroTik الخاص بك، ثم افتح نافذة Terminal (أو من القوائم الجانبية) ونفّذ التالي:

أ. تفعيل خدمة الـ REST API / Web:
التطبيق يتصل بالراوتر عبر بروتوكول HTTP/HTTPS، لذا يجب التأكد من تفعيل خدمة www:

# تفعيل خدمة الويب المحلية (Port 80) أو المشفرة (Port 443)
/ip service enable www
/ip service enable www-ssl
(يمكنك التحقق من القائمة عبر IP > Services في WinBox والتأكد من أن www لا تحمل علامة X حمراء).

ب. إنشاء مجموعة ومستخدم مخصص للتطبيق بصلاحيات آمنة:
لحماية الراوتر وعدم استخدام حساب admin الرئيسي، قم بإنشاء مستخدم مخصص يمتلك صلاحيات إدارة الهوتسبوت وقراءة الترافيك:

# 1. إنشاء مجموعة صلاحيات باسم abayazeed_api
/user group add name=abayazeed_api policy=read,write,api,rest,test

# 2. إنشاء المستخدم وكلمة المرور (اختر كلمة مرور من عندك)
/user add name=app_user group=abayazeed_api password="YourPassword2024" comment="Abayazeed Mobile App"
2️⃣ التحقق من اتصال الهاتف بالشبكة المحلية للراوتر
تأكد من أن هاتفك الذكي (الذي ثبّت عليه التطبيق) متصل بنفس شبكة الـ Wi-Fi التابعة لراوتر MikroTik أو الأكسس بوينت المتصل به.
اعرف عنوان الـ IP المحلي للراوتر (الافتراضي عادةً هو 192.168.88.1 أو 192.168.1.1).
(يمكنك معرفته في WinBox من قائمة IP > Addresses).
3️⃣ إدخال بيانات الربط داخل تطبيق «أبايذيد لنك منجر»
افتح التطبيق على هاتفك.
من القائمة الجانبية أو الأيقونة العلوية، ادخل إلى شاشة «إعدادات العتاد و MikroTik».
املأ حقول الاتصال كالتالي:
عنوان الراوتر (Host IP): اكتب الـ IP للراوتر، مثلاً: 192.168.88.1
المنفذ (Port): 80 (أو 443 في حال استخدام SSL)
اسم المستخدم (Username): app_user
كلمة المرور (Password): YourPassword2024
اضغط على زر «فحص ومزامنة الاتصال (Test & Sync Connection)».
4️⃣ تأكيد نجاح الربط
ستتحول الشارة العلوية في التطبيق فوراً من OFFLINE إلى ONLINE باللون السيبراني المشع (#00e5ff).
سيبدأ التطبيق فوراً في سحب:
عدد الجلسات النشطة في الهوتسبوت (/ip/hotspot/active).
معدل سحب الباندويث المباشر لمنافذ WAN و Starlink SFP.
قراءة استهلاك المعالج ودرجة حرارة الراوتر.
5️⃣ اختبار توليد كرت ومراقبته داخل WinBox
داخل التطبيق، اذهب إلى «إدارة الكروت والفئات» واضغط على «توليد دفعة جديدة».
في نفس اللحظة على كمبيوترك، افتح في WinBox:
IP > Hotspot > Users
ستشاهد الكروت الجديدة قد أُضيفت فوراً في الجدول داخل WinBox مع الـ PIN والبروفايل الخاص بها، وتكون جاهزة للاستخدام والطباعة فوراً!
💡 ملاحظة فنية هامة:
إذا كان الراوتر في موقع بعيد وأردت الربط خارج شبكة الـ Wi-Fi المحلية، يمكنك استخدام عنوان Cloud DNS الخاص بميكروتك (IP > Cloud) أو خدمة VPN مثل WireGuard / ZeroTier، ووضع العنوان في التطبيق للتحكم بشبكتك من أي مكان بالعالم.`,suggested_follow_ups:[


الأدوات التي نحتاجها لبناء التطبيق على الكمبيوتر؟


لبناء وتجميع تطبيق «أبايذيد لنك منجر — Abayazeed Link Manager» بنجاح على جهاز الكمبيوتر وإنتاج ملف APK جاهز للتثبيت على الهواتف وأجهزة الكاشير وSunmi، تحتاج إلى تثبيت 4 أدوات برمجية رئيسية فقط.

إليك قائمة الأدوات وروابطها ومواصفاتها الموصى بها:

1️⃣ حزمة بيئة التطوير (Flutter SDK)
الوصف: المحرك البرمجي الأساسي لقراءة أكواد Dart وتجميع شاشات التطبيق لملفات APK.
الإصدار الموصى به: Flutter 3.19.0 فما فوق (يتضمن Dart 3.3+).
طريقة التحميل: من الموقع الرسمي flutter.dev.
التثبيت: فك الضغط في مسار بسيط (مثل C:\flutter على ويندوز)، ثم أضف مسار C:\flutter\bin إلى متغيرات النظام (System PATH).
2️⃣ بيئة جافا (Java Development Kit - OpenJDK 17)
الوصف: ضرورية جداً لبناء نظام أندرويد وتشغيل Gradle الخاص بحزم التطبيق وطابعات Sunmi دون تعارضات.
الإصدار الموصى به: JDK 17 (LTS). (تجنب استخدام Java 8 أو إصدارات أقدم).
الخيارات المتاحة:
Microsoft Build of OpenJDK 17 أو Adoptium Temurin 17.
الضبط: ضبط متغير البيئة JAVA_HOME ليشير إلى مسار تثبيت الـ JDK.
3️⃣ أدوات سطر الأوامر لأندرويد (Android Studio & SDK Command-line Tools)
الوصف: توفر مكتبات نظام أندرويد (Android SDK)، أدوات البناء (Build Tools API 33/34)، ومحرك التثبيت adb.
طريقة التثبيت:
حمّل وثبّت Android Studio من developer.android.com/studio.
افتح SDK Manager داخل أندرويد ستوديو، وتأكد من تحديد:
Android SDK Platform 33 أو 34.
Android SDK Command-line Tools (latest).
Android SDK Build-Tools.
4️⃣ محرر الأكواد (VS Code أو Android Studio)
VS Code (الخيار الأخف والأسرع):
ثبّت إضافة Flutter الرسمية (ستقوم بتثبيت إضافة Dart تلقائياً).
Git for Windows (اختياري ولكنه موصى به):
يوفر بيئة Git Bash التي تتيح لك تشغيل سكريبت إنشاء المشروع التلقائي بنقرة زر.
🩺 خطوة التحقق السريع من جاهزية جهازك (Flutter Doctor)
بعد تثبيت الأدوات، افتح سطر الأوامر (CMD أو PowerShell أو Terminal) ونفّذ:

flutter doctor
إذا ظهرت لك علامات الصح الخضراء [✓] بجانب:

[✓] Flutter
[✓] Android toolchain
[✓] Android Studio / VS Code
فهذا يعني أن كمبيوترك جاهز 100% فوراً لتنفيذ أوامر المشروع:

cd abayazeed_link_manager
flutter pub get
flutter build apk --release
وسيكون ملف الـ app-release.apk جاهزاً في مجلد build/app/outputs/flutter-apk/.

