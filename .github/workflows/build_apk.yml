كيف أختبر الاتصال الفعلي براوتر MikroTik من داخل المحاكي؟


🌐 دليل اختبار وربط راوتر MikroTik الفعلي من داخل محاكي الأندرويد (Android Emulator)
لاختبار الاتصال الفعلي بين تطبيق «أبايذيد لنك منجر» الذي يعمل داخل محاكي الأندرويد وراوتر MikroTik RouterOS على أرض الواقع، يجب مراعاة طبيعة شبكة المحاكي الافتراضية وكيفية توجيه الطلبات.

تم توثيق الدليل الشامل وحفظه في مساحة العمل كمرجع تقني تحت عنوان: 📄 «دليل اختبار اتصال MikroTik من داخل المحاكي»

1️⃣ فهم بنية شبكة المحاكي (The Golden Rule):
محاكي أندرويد (QEMU/AVD) يعمل خلف Virtual NAT:
الـ IP الخاص بنظام المحاكي هو دائماً: 10.0.2.15.
كمبيوترك المضيف (Host PC) يُرى من داخل المحاكي عبر العنوان: 10.0.2.2.
تنبيه: لا تستخدم localhost أو 127.0.0.1 داخل المحاكي نهائياً، لأنها تشير إلى الهاتف الافتراضي نفسه وليس للكمبيوتر أو الراوتر!
2️⃣ كيف يتصل المحاكي بالراوتر الفعلي؟ (السيناريوهات العملية):
🔹 السيناريو الأكثر شيوعاً: الراوتر والكمبيوتر على نفس الشبكة المحلية (LAN / Wi-Fi)
إذا كان كمبيوترك متصلاً براوتر MikroTik (سواء عبر كيبل أو Wi-Fi)، ويحمل الراوتر عنواناً محلياً مثل 192.168.88.1:

يقوم المحاكي تلقائياً بتمرير حزم البيانات عبر كرت شبكة كمبيوترك.
في خانة عنوان الراوتر (Host IP) داخل التطبيق: ضع الـ IP الفعلي لميكروتك مباشرة:
192.168.88.1
🔹 سيناريو الراوتر الوهمي (CHR داخل VirtualBox / VMware على نفس الكمبيوتر):
اضبط كرت شبكة راوتر MikroTik الوهمي على وضعية Bridged Adapter ليحصل على IP مستقل من شبكتك المنزلية، واستخدم ذلك الـ IP.
أو استخدم العنوان 10.0.2.2 مع توجيه منفذ (Port Forwarding) للمنفذ 80 أو 443.
3️⃣ تجهيز وتفعيل REST API في راوتر MikroTik (خطوة إلزامية):
لكي يقبل راوتر ميكروتك (RouterOS v7+) أوامر التطبيق لقراءة الجلسات وحقن الكروت، افتح Terminal في برنامج WinBox ونفّذ:

# 1. تفعيل خدمات الـ REST و الـ Web
/ip service enable www
/ip service enable www-ssl

# 2. إنشاء مستخدم مخصص للتطبيق بصلاحيات التحكم
/user group add name=link_manager policy=read,write,api,rest,test
/user add name=app_admin group=link_manager password="YourPassword123" comment="Abayazeed Mobile App"
4️⃣ اختبار الاتصال الأولي السريع (قبل أو أثناء تشغيل التطبيق):
أ. الفحص من متصفح المحاكي:
افتح متصفح Chrome داخل شاشة المحاكي، واكتب:

http://192.168.88.1/webfig
إذا فتحت واجهة الراوتر داخل المحاكي، فهذا يعني أن المسار الشبكي مفتوح وسليم 100%.

ب. الفحص البرمجي عبر ADB و Curl:
افتح الطرفية (Terminal) في كمبيوترك للتأكد من استجابة REST API من داخل بيئة أندرويد:

adb shell
curl -k -u app_admin:YourPassword123 http://192.168.88.1/rest/system/resource
ستحصل على رد فوري يحتوي على بيانات المعالج وذاكرة الراوتر والـ Uptime.

5️⃣ بدء الربط والمزامنة داخل التطبيق:
في التطبيق على المحاكي، افتح شاشة «إعدادات العتاد و MikroTik» (SCREEN_37).
أدخل:
IP: 192.168.88.1
Port: 80 (أو 443)
User: app_admin
Password: YourPassword123
اضغط على «فحص ومزامنة الاتصال»:
ستتحول الشارة العلوية فوراً إلى ONLINE باللون الأزرق السيبراني.
ستظهر الجلسات الحية النشطة في قائمة المشتركين (SCREEN_41)، وسيتمكن التطبيق من حقن وتوليد الكروت في راوترك الفعلي مباشرة.

