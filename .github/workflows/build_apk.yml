تم إنشاء المستودع، ما الخطوة التالية؟


### 🚀 مبروك! تم إنشاء المستودع بنجاح — الآن الخطوة التالية لبناء الـ APK بضغطة زر 📱⚡ أمامنا خطوتان سريعتان فقط من متصفح هاتفك، وبعدها ستبدأ خوادم GitHub السحابية ببناء وتنزيل ملف التطبيق (**APK**) إلى هاتفك مباشرة: --- ### 1️⃣ الخطوة الأولى: إضافة ملف البناء التلقائي (`build_apk.yml`) 1. من الصفحة الرئيسية لمستودعك الجديد على الهاتف، اضغط على زر: **`Add file`** ثم اختر **`Create new file`**. 2. في خانة اسم الملف بالأعلى (Name your file)، اكتب بالضبط المسار التالي: ```text .github/workflows/build_apk.yml ``` *(ملاحظة: بمجرد كتابة الشرطة المائلة `/` سيقوم GitHub بإنشاء مجلد `.github` ثم مجلد `workflows` تلقائياً).* 3. في مربع محتوى الملف الكبير بالأسفل، انسخ والصق الكود التالي بالكامل: ```yaml name: 🚀 Build & Release Abayazeed Link Manager APK on: push: branches: [ main, master ] workflow_dispatch: jobs: build-apk: name: 🏗️ بناء ملف APK سحابياً runs-on: ubuntu-latest timeout-minutes: 25 steps: - name: 📥 جلب ملفات المستودع uses: actions/checkout@v4 - name: 📦 فك ضغط ملفات المشروع (إن وجدت) run: | if [ -f project.zip ]; then unzip -o project.zip -d . fi - name: ☕ إعداد بيئة Java 17 uses: actions/setup-java@v4 with: distribution: 'temurin' java-version: '17' cache: 'gradle' - name: 💙 إعداد بيئة Flutter 3.19 uses: subosito/flutter-action@v2 with: flutter-version: '3.19.0' channel: 'stable' cache: true - name: 📦 تحميل حزم pubspec.yaml run: flutter pub get - name: 🔨 تجميع وبناء ملف APK للإنتاج run: flutter build apk --release - name: 🏷️ تجهيز وتسمية الـ APK run: | mkdir -p output_release cp build/app/outputs/flutter-apk/app-release.apk output_release/abayazeed_link_manager_v4.2.apk - name: 📤 رفع ملف الـ APK للتحميل المباشر uses: actions/upload-artifact@v4 with: name: abayazeed-link-manager-apk path: output_release/abayazeed_link_manager_v4.2.apk retention-days: 30 ``` 4. انزل لأسفل الصفحة واضغط على الزر الأخضر: **`Commit changes...`** ثم أكد بالضغط على **`Commit changes`**. --- ### 2️⃣ الخطوة الثانية: رفع ملف المشروع `project.zip` 1. ارجع للصفحة الرئيسية للمستودع. 2. اضغط على زر **`Add file`** ثم اختر **`Upload files`**. 3. اضغط على **Choose your files** واختر ملف **`project.zip`** من هاتفك. 4. اضغط على الزر الأخضر: **`Commit changes`**. --- ### 3️⃣ كيف تتابع بناء الـ APK وتنزله في هاتفك؟ 1. من الشريط العلوي في صفحة المستودع، اضغط على تبويب **Actions** ⚙️. 2. ستشاهد سير العمل التلقائي يعمل الآن ودائرة صفراء تدور إيذاناً ببدء بناء التطبيق. 3. خلال **3 إلى 4 دقائق**، ستتحول الدائرة إلى علامة صح خضراء `✓`. 4. اضغط على اسم العملية الخضراء، وانزل لأسفل الصفحة عند قسم **Artifacts**، ستجد: ```text abayazeed-link-manager-apk ``` 5. اضغط عليه لتحميل ملف الـ APK مباشرة إلى هاتفك، ثم افتحه وثبته فوراً! أخبرني بمجرد إضافة الملفين أو إذا ظهر لك أي استفسار أثناء الخطوات! 🚀

