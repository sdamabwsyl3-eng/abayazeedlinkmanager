وتسميته باسم أبايذيد لنك منجر


تم بنجاح اعتماد هوية وتسمية «أبايذيد لنك منجر — Abayazeed Link Manager» وتوليد لوحة التحكم الرئيسية (Dashboard) المتوافقة كلياً مع نظام التصميم:

ما تم إنجازه:
شعار وهوية البراند التقنية (شعار أبايذيد لنك منجر):

تصميم شعار رسمي فائق الدقة يدمج مدار الأقمار الصناعية (Starlink)، نبضات التردد الشبكي، ومؤشرات الاتصال لراوترات (MikroTik) باللون السيان المتوهج (#00e5ff) والأزرق التقني مع اسم «أبايذيد لنك منجر».
لوحة التحكم الرئيسية (أبايذيد لنك منجر — لوحة التحكم الرئيسية):

الهيدر التفاعلي: يبرز اسم وهوية التطبيق، مع بطاقتي مراقبة حية لأجهزة Starlink Gen 3 و MikroTik CCR2004 مع قياسات الـ CPU وPing وحالة التشغيل.
مؤشرات الأداء الرئيسية (KPIs):
سرعة التنزيل والرفع الحية (212.6 Mbps / 27.8 Mbps).
المشتركون النشطون حالياً (142 من 250 كرت مفعل).
حجم الاستهلاك اليومي للبيانات (1.42 TB).
مبيعات اليوم ومخزون الكروت المتبقية (420,000 د.ع / 84 كرت).
رادار محاذاة الأقمار الصناعية (Starlink Phased Array): مراقبة زوايا الارتفاع، نسبة الحجب (0.0%)، وقوة الإشارة SNR (12.8 dB).
مراقبة تدفق بيانات الراوتر بورد (RouterOS Throughput): رسم بياني مباشر لمنافذ SFP+ Core Switch و Ether1 WAN.
جلسات المشتركين النشطة (Hotspot Active Sessions): جدول فوري للمشتركين يتضمن عناوين IP و MAC، الاستهلاك الفعلي، الوقت المتبقي، وإجراءات التحكم المباشر.



نبدأ المشروع المشروع بالكامل


أهلاً بك! جاهزون للانطلاق في بناء مشروع «أبايذيد لنك منجر — Abayazeed Link Manager» بالكامل وفقاً لمواصفات الدليل الفني ونظام التصميم المعتمد.

استناداً إلى وثائق المشروع (README.md ودليل تصميم وبناء تطبيق Starlink وMikroTik)، يتكون النظام المتكامل من الشاشات والوحدات الرئيسية التالية:

إدارة الكروت والفئات (Hotspot Cards & Profiles):
توليد دفعات الكروت وطباعتها (Thermal / A4)، تحديد السرعات والحصص، وإدارة الأسعار والمخزون.
المشتركون النشطون والجلسات (Active Users & Hotspot Hosts):
مراقبة حية للمتصلين، استهلاك البيانات الفعلي، الوقت المتبقي، وفصل/تجميد الجلسات.
تحليلات وتقارير الشبكة والمبيعات (Analytics & Financial Reports):
رسوم بيانية لحركة الترافيك، الإيرادات اليومية والشهرية، ساعات الذروة، واستهلاك الباندويث.
إعدادات ومراقبة العتاد (MikroTik RouterOS & Starlink Terminal Config):
ضبط اتصال الـ API / REST، مراقبة حرارة ومنافذ الراوتر، وزوايا ومحاذاة طبق ستارلينك وإعدادات السحابة (Supabase).
كيف تفضل أن نبدأ التنفيذ؟

الخيار 1: توليد شاشة «إدارة الكروت والفئات» (توليد، طباعة، وتحكم بالباقات) أولاً.
الخيار 2: توليد شاشة «المشتركون النشطون ومراقبة الجلسات الحية».
الخيار 3: بناء جميع الشاشات الأربعة تباعاً في تدفق عمل متكامل.

الخيار 3


تم إنجاز وتوليد مشروع «أبايذيد لنك منجر — Abayazeed Link Manager» بالكامل وفق متطلبات الدليل الفني ونظام التصميم المعتمد، حيث تم ربط كافة الشاشات بإطار عمل موحد (Persistent App Shell) يدعم اللغة العربية (RTL) مع شريط تنقل علوي وقائمة جانبية تفاعلية:

الشاشات المكتملة في المشروع:
لوحة التحكم الرئيسية (لوحة العمليات والمراقبة المركزية - Dashboard):

متابعة حية لسرعات Starlink ونقاء الإشارة والعوائق.
مراقبة موارد راوتر MikroTik CCR2004 ومنافذه وسرعات الـ Throughput اللحظية.
ملخص مبيعات اليوم وجلسات المشتركين وسجل الأحداث الحي.
إدارة الكروت والفئات (Cards & Profiles Management) — أبايذيد لنك منجر — إدارة الكروت والفئات:

فئات وباقات الاشتراكات (Hotspot User Profiles): بطاقات تفاعلية لتحديد سرعات MikroTik Queue، حصص الجيجابايت، وصلاحية الجلسات.
محرك توليد الكروت التلقائي (Batch Generator): أداة متقدمة لتوليد الدفعات بأكواد سريعة مع معاينة حية لشكل كرت الطباعة الحرارية (80mm) المزود بـ QR Code.
مستودع الكروت المتاحة: جدول تفصيلي مع خيارات الفلترة، تصدير CSV، وطباعة A4 / حراري.
المشتركون النشطون والجلسات (Active Hotspot Users & Sessions) — أبايذيد لنك منجر — المشتركون النشطون والجلسات:

مراقبة حية للمتصلين (142 جهاز): عرض تفصيلي للأجهزة، عناوين IP و MAC، ونقاط البث المرتبطة بها.
الاستهلاك والسرعات المباشرة: أشرطة استهلاك الباندويث والوقت المتبقي لكل مشترك.
أدوات التحكم السريع: إمكانية فصل المشترك (Kick)، تجميد السرعة (Throttle)، ومراقبة أبراج البث (Sectors) وقمر Starlink المتصل.
التحليلات والتقارير المالية والشبكية (Analytics & Reports) — أبايذيد لنك منجر — التحليلات والتقارير:

مؤشرات الأداء المالي: إجمالي الإيرادات (4,850,000 د.ع)، معدلات نمو المبيعات، وتوزيع الباقات الأكثر ربحية.
مقارنة حركة البيانات (Traffic Flow): رسم بياني يقارن سحب المشتركين بتدفق Starlink WAN مع مؤشرات جودة الاتصال وتذبذب البينغ.
تحليل نوع حركة المرور (DPI): تصنيف الباندويث بين منصات الفيديو، السوشيال ميديا، والألعاب الأونلاين.
تقرير محاسبة وكلاء ونقاط التوزيع الميدانية: تتبع الكروت المسلمة والمبالغ المستحقة.
إعدادات العتاد و MikroTik / Starlink (Hardware & API Settings) — أبايذيد لنك منجر — إعدادات العتاد و MikroTik:

ضبط بروتوكول MikroTik REST / API: إعدادات الـ Host IP، المنفذ، وتيرة المزامنة التلقائية، واختبار الاتصال المباشر.
التحكم بهوائي Starlink Gen 3: قراءات الزوايا التلقائية، خريطة العوائق، وتشغيل سخان إذابة الثلوج وإعادة التشغيل عن بعد.
الربط السحابي (Supabase Cloud Sync): إدارة طابور العمليات في وضع عدم الاتصال (Offline Queue).
طرفية أوامر الراوتر (Terminal Shell): موجه أوامر تفاعلي لتنفيذ أوامر RouterOS مباشرة.





توليد شاشة صفحة تسجيل الدخول للهوتسبوت (Hotspot Captive Portal) المتوافقة مع الهوية


تم بنجاح تصميم وتوليد صفحة تسجيل الدخول لشبكة الهوتسبوت (MikroTik Hotspot Captive Portal) المتوافقة كلياً مع هوية وتصميم «أبايذيد لنك منجر — Abayazeed Link Manager» للأجهزة المحمولة وبدعم كامل للغة العربية (RTL).

أبرز ميزات ومكونات صفحة الهوتسبوت (Captive Portal):
الترويسة ومؤشرات البث الفضائي:

إبراز شعار وهوية الشبكة مع إشعار نبضي «بث فضائي مباشر عبر كوكبة Starlink V2».
شريط إحصائيات حي يُطمئن المشترك بجودة وسرعة التصفح قبل الدخول: التحميل 220+ Mbps، زمن الاستجابة 28ms، واستقرار الإشارة 99.8%.
نموذج تسجيل الدخول المتكامل (MikroTik RouterOS Login Form):

تبديل نمط الدخول: خيار «كرت الهوتسبوت (PIN Code)» كخيار رئيسي، أو «اشتراك VIP / مستخدم» للاشتراكات الشهرية.
حقل إدخال ذكي لكود الكرت: يدعم الصيغ الأبجدية الرقمية المتطابقة مع نظام توليد الكروت (مثل AY-24H-894102) أو الأكواد الرقمية المباشرة (6 أرقام).
زر ماسح الـ QR Code: لتمكين المشترك من مسح كود الكرت المطبوع على كروت الـ 80mm بكاميرا الهاتف مباشرة دون الحاجة للكتابة اليدوية.
زر الدخول الرئيسي المتوهج: «دخول إلى الإنترنت الآن ⚡» المتوافق مع أوامر الـ Captive Portal.
خيار حفظ الاتصال التلقائي عبر الماك أدرس (MAC-Cookie).
الاستعلام عن الرصيد وحالة الكرت:

ميزة «فحص رصيد الكرت والوقت المتبقي دون تسجيل خروج أو استهلاك للباقة».
دليل فئات وباقات الإنترنت المتاحة:

عرض أسعار ومواصفات الكروت للزبائن الجدد (باقة 24 ساعة توربو الأكثر طلباً، باقة 3 ساعات السريعة، الباقة الأسبوعية، واشتراك الـ VIP الشهري).
نقاط التوزيع والدعم الفني المباشر:

قائمة نقاط البيع المعتمدة للشبكة (سوبرماركت البركة، كافيه النورس، مجمع الأمل).
زر مباشر للتواصل مع الدعم الفني عبر واتساب، مع شارة أمان تؤكد حماية البيانات بجدار حماية MikroTik FastPath.


تصميم شاشة الحالة والوقت المتبقي بعد تسجيل الدخول (Hotspot Status / Connected Screen)


تم بنجاح تصميم وتوليد شاشة حالة الاتصال والوقت المتبقي بعد تسجيل الدخول (MikroTik Hotspot Status / Connected Screen) لتطبيق «أبايذيد لنك منجر — Abayazeed Link Manager» المتوافقة تماماً مع نظام التصميم والهوية المعتمدة للأجهزة المحمولة.

أبرز ميزات ومكونات شاشة حالة الاتصال (Hotspot Status Screen):
مؤشر الاتصال الحي ومصدر البث الفضائي:

شارة تفاعلية تؤكد أن المشترك «متصل بالإنترنت الآن» مع نقطة إشارة نبضية خضراء.
تحديد مصدر التغذية ونقطة البث المتصل بها الهاتف: «Starlink Gen 3» وبرج البث «برج 1 (المنصور - 5GHz)» مع تفعيل تقنية FastPath.
عداد الوقت المتبقي الدائري (Circular Countdown HUD):

مؤشر دائري تقني عالي الدقة يبرز الوقت المتبقي بالدقائق والثواني (18:42:12).
نسبة الوقت المتبقي (78% متبقي) مع توضيح موعد انتهاء الصلاحية الفعلي (تنتهي غداً 11:30 صباحاً).
رصيد وحصة البيانات ومعدل السحب اللحظي (Traffic & Quota Meter):

شريط تقدم ذكي لحصة الجيجابايت: المتبقي 7.8 GB من إجمالي 10.0 GB، مع تفصيل الاستهلاك (تنزيل 1.9 GB / رفع 300 MB).
مؤشر سرعة التحميل والرفع اللحظي المباشر (21.9 Mbps تنزيل / 3.3 Mbps رفع) مع مؤثر تخطيط مرئي للتردد.
بطاقة بيانات الجلسة وعنوان الجهاز (Session Details):

رقم الكرت المستخدم: AY-24H-894102 مع زر نسخ سريع.
عنوان الـ IP المخصص للمشترك عبر الـ DHCP: 192.168.88.104.
عنوان الماك أدرس (MAC Address): D4:61:9D:28:44:A2.
سقف السرعة المحددة في الـ Queue: 50 Mbps Turbo Speed، وزمن الاستجابة المباشر Ping 26ms.
أداة الفحص السريع وأزرار التحكم بالاتصال:

ويدجت «فحص السرعة السريع» لاختبار الجودة وزمن الـ Jitter في أي وقت.
زر التمديد والشحن الفوري: «شحن وتمديد الباقة الآن».
خيار «تجميد الجلسة» لإيقاف استهلاك الوقت عند الرغبة.
زر أحمر بارز لـ «تسجيل الخروج» لقطع الاتصال وحفظ باقي الرصيد في راوتر MikroTik.
مؤشر المزامنة التلقائية لبيانات الـ Hotspot كل 10 ثوانٍ، وزر واتساب مباشر للدعم الفني.


تصميم شاشة إشعار انتهاء الرصيد أو الوقت (Session Expired Screen)


تم بنجاح تصميم وتوليد شاشة «إشعار انتهاء الرصيد أو الوقت» (MikroTik Hotspot Session Expired / Quota Depleted) لتطبيق وموقع «أبايذيد لنك منجر — Abayazeed Link Manager» للأجهزة المحمولة، والمتوافقة كلياً مع نظام التصميم والهوية المعتمدة.

أبرز ميزات ومكونات شاشة انتهاء الجلسة (Session Expired):
شريط الحالة وبطاقة التنبيه المركزية (Alert & Notice HUD):

إشعار نظام علوي SESSION_REVOKED MikroTik Core #04 يوضح حالة البوابة للمشترك.
أيقونة الساعة الرملية التقنية بلون تحذيري ناعم مع شارة توقف الخدمة المؤقت.
عنوان واضح ومباشر: «تم استنفاد رصيد الجلسة» يرافقه نص إرشادي مطمئن للمستخدم لاستئناف التصفح الفضائي عبر Starlink فور إدخال كرت جديد.
مؤشر السرعة الحالية المقفلة (0.00 Kbps) مع بيان أن ربط الأقمار الصناعية جاهز ومتاح.
ملخص تفاصيل الجلسة المنتهية (Session Depletion Audit):

كود الكرت السابق المستخدم: AY-24H-894102 مع زر نسخ الكود.
شريط مؤشر استهلاك الحصة باللون التحذيري يوضح استهلاك كامل الحصة: 10.0 GB من 10.0 GB (100%).
تفاصيل الاتصال الفعلي: اسم الباقة (24 ساعة توربو)، مدة الاتصال (24:00:00 ساعة)، توقيت إغلاق الجلسة، وعناوين IP و MAC Address الخاصين بهاتف المستخدم للتحقق.
نموذج التجديد الفوري (Instant Voucher Recharge):

