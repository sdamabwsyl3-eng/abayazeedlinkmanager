لوحة خيارات وتجهيز الطباعة والموديلات (Printer & Batch Controls):

التبديل السريع بين بروفايلات الطابعات الشهيرة: Xprinter XP-420B, Sunmi V2 Pro POS, Epson TM-T20III, Bixolon SRP-330II.
منزلق التحكم بكثافة الحبر الحراري Thermal Darkness (120% High Scan) لضمان جودة قراءة كاميرات الهواتف للـ QR.
خيارات تخصيص الإيصال: تفعيل/تعطيل الـ QR، الباركود الخطي، توقيع الراوتر، وتفعيل قناع الحماية المشفر للرقم السري (PIN Scramble Mask).
أزرار التحكم الفوري: طباعة فورية للطابعة الحرارية (F5) وتغذية تجريبية للرول (Feed).
