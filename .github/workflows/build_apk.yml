لقد انتقلنا الآن من بيئة الاختبار والمحاكاة إلى الميدان الحي. لتشغيل تطبيق «أبايذيد لنك منجر — Abayazeed Link Manager» وربطه بالعتاد الفعلي (راوتر MikroTik، طبق Starlink، وطابعة Sunmi / الكاشير)، اتبع هذا المسار الميداني خطوة بخطوة:

📋 المسار الميداني للتشغيل المباشر (Field Runbook):
