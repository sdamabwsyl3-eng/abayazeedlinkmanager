مفتش الأوامر المباشر (Hex & ASCII Inspector): عرض مصفوفة البايتات المرسلة لمنفذ الطابعة (<1B 40> تهيئة، <1B 61 01> توسيط، <1D 76 30> صورة نقطية للـ QR، و <1D 56 00> قص الورق).
