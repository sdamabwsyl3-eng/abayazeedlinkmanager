شرح طريقة اختبار كود Sunmi على محاكي الأندرويد


دليل اختبار ومحاكاة كود طابعات Sunmi على محاكي الأندرويد (Android Emulator)
منظومة «أبايذيد لنك منجر — Abayazeed Link Manager»

التحدي التقني في محاكي الأندرويد القياسي:
طابعات أجهزة Sunmi المدمجة (مثل V2, V2 Pro, T2) ترتبط بالنظام عبر خدمة نظام داخلية (woyou.aidlservice.jiuai). عند تشغيل التطبيق على محاكي Android الرسمي (AVD)، تكون هذه الخدمة غير متوفرة، مما قد يسبب فشل الاتصال (bindingPrinter == false) أو توقف عملية الطباعة.

لحل ذلك واختبار التطبيق بسلاسة تامة، تم تجهيز وتوثيق طريقتين معتمدتين عالمياً:

1. الطريقة الأولى: وضع المحاكاة والمعاينة البرمجي الذكي (Mock / Virtual Printer) — [الخيار الأفضل والموصى به]
تم تحديث كلاس خدمة الطباعة SunmiPrinterService ليتعرف تلقائياً على بيئة التشغيل:

على الجهاز الفعلي (Sunmi): يطبع مباشرة على الورق الحراري وينفذ القص التلقائي.
على المحاكي (Emulator) أو الهاتف العادي: يتحول فوراً وبشكل صامت إلى وضع المحاكاة الافتراضية (Virtual Mode)، حيث:
يسجل كافة بيانات الكرت والـ QR والباركود في طرفية الـ Console للتدقيق.
يعرض نافذة منبثقة تفاعلية (Preview Modal) على شاشة المحاكي تحاكي شكل الإيصال الحراري الفعلي مع رسم الـ QR وكود الدخول ومحاكاة القص الآلي.
يضمن استمرار تدفق تجربة المستخدم بنجاح دون أي انهيار أو توقف.
2. الطريقة الثانية: تثبيت خدمة محاكي Sunmi الافتراضية داخل المحاكي (Virtual AIDL Service APK)
تشغيل محاكي Android Studio (يُفضل Android 10 أو 11 بنواة x86_64).
تثبيت ملف خدمة المحاكاة من مجتمع Sunmi عبر السحب والإفلات أو عبر أمر ADB:
adb install woyou_service_virtual.apk
التحقق من توفر الخدمة في المحاكي:
adb shell pm list packages | grep woyou
بمجرد وجودها، سيعمل كود حزمة sunmi_printer_plus بشكل طبيعي وكأنه جهاز فعلي.
تم حفظ ونشر الدليل الكامل متضمناً كود sunmi_printer_service.dart المحدث وجدول المقارنات في مساحة العمل تحت عنوان:
«دليل اختبار كود Sunmi على محاكي الأندرويد» (DOCUMENT_48).


