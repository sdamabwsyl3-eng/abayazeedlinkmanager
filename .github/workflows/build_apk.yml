تنظيم الفصول الستة الرئيسية المشروحة في كراسة النظام:
الهيكلية وطوبولوجيا الربط (Starlink -> Bypass -> MikroTik CCR -> Distribution).
إعدادات RouterOS & Hotspot والـ MAC-Cookie.
تكامل الـ APIs والمزامنة الحية (REST API / Supabase).
توليد الكروت وفئات الحصص.
توجيه الترافيك وإدارة QoS والـ Mangle.
استكشاف الأعطال وحالة الاتصال و Netwatch.
مخطط تدفق الإشارة والمعمارية (End-to-End Topology Pipeline):

تمثيل هندسي تفاعلي لمسار الإشارة من مدار الأقمار الصناعية (Starlink LEO) إلى صحن الاستقبال Dish Gen 3 مع وضع الـ Bypass Mode، مروراً برابط الـ 1Gbps WAN وصولاً لراوتر MikroTik Cloud Core Router CCR2004، ثم شبكة التوزيع نحو أبراج الـ Wi-Fi والألياف الضوئية.
بطاقة تنبيه حرجة باللون التحذيري لمشكلة Double NAT وشرح ضبط منفذ ether1 WAN لتفادي تراجع زمن الاستجابة (Ping Spikes).
بنك الأكواد والسكربتات الفورية (RouterOS Command Bank):

مربعات أكواد داكنة مبرمجة وجاهزة للنسخ بنقرة واحدة عبر زر «نسخ السكربت»:
سكربت إنشاء بروفايل السرعات وتفعيل الكوكي: /ip hotspot user profile.
سكربت استثناء مشتركي الهوتسبوت من الـ FastTrack لمنع تسريب الحصص: /ip firewall filter.
سكربت المراقبة التلقائية لحزمة الستارلينك عبر /tool netwatch والتحويل عند انقطاع الاتصال الفضائي.
مصفوفة المعايير الفنية لتفادي اختناقات حزم Starlink LEO:

جدول المعايير والـ Best Practices الميدانية:
حجم الحزمة WAN MTU الموصى به (1500 بايت).
ضبط تقنية TCP MSS Clamping (1440 بايت) لمنع تعليق البث المباشر والمواقع.
نمط راوتر الستارلينك: Bypass (Bridge) Mode.
خوادم الـ DNS الأولية: 1.1.1.1 و 8.8.8.8.
خوارزمية إدارة الطوابير: Cake / FQ-CoDel للتخلص من ظاهرة الـ Bufferbloat أثناء الذروة.
بطاقات إرشادية مخصصة لتفعيل MAC-Cookie الذكي وتحسين أداء الفلترة بـ Raw Firewall.
