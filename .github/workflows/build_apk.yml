ما نجح معاي انشاء apk


لا تقلق أبداً يا صديقي! هذا الأمر طبيعي جداً عند بناء أول تطبيق عبر خوادم **GitHub Actions** من الهاتف، والحل بسيط ومحدد جداً. --- ### 🔍 ما هو سبب عدم النجاح في الغالب؟ هناك **سببان رئيسيان فقط** لحدوث المشكلة عند الرفع من الهاتف: 1. **السبب الأول (الأكثر شيوعاً): خوادم GitHub تحتاج فك الضغط التلقائي لملف `project.zip`:** - ملف `build_apk.yml` الأصلي كان يبحث عن ملفات المشروع المباشرة (مثل `pubspec.yaml`) مباشرة في المستودع. - لكن عندما نرفع `project.zip` كملف مضغوط، يجد خادم GitHub ملف الـ zip فقط ولا يجد ملف `pubspec.yaml` مفكوكاً، فيتوقف البناء ويعطي خطأ: `Error: No pubspec.yaml file found`. 2. **السبب الثاني: مسار ملف البناء غير دقيق:** - يجب أن يكون اسم ومسار الملف في المستودع بالضبط: `.github/workflows/build_apk.yml` --- ### 🛠️ الحل الجذري بضغطة واحدة (تحديث ملف `build_apk.yml` السحري) قمنا الآن بتحديث كود **`build_apk.yml`** ليتكفل تلقائياً بالآتي: - يقوم خادم GitHub **بفك ضغط `project.zip` تلقائياً** فور العثور عليه. - يقوم بنقل الملفات إلى مسارها الصحيح فوراً وبناء ملف الـ **APK** دون أي تدخل منك! --- ### 📋 إليك كود `build_apk.yml` الذكي المحدّث (انسخه بالكامل): ```yaml name: 🚀 Build & Release Abayazeed Link Manager APK on: push: branches: - main - master workflow_dispatch: jobs: build-apk: name: 🏗️ بناء ملف APK عبر خوادم GitHub السحابية runs-on: ubuntu-latest timeout-minutes: 25 steps: # 1. جلب محتويات المستودع - name: 📥 جلب كود المشروع (Checkout Repository) uses: actions/checkout@v4 # 2. فك ضغط ملف project.zip تلقائياً إن وجد - name: 📦 فك ضغط حزمة المشروع التلقائي run: | if [ -f "project.zip" ]; then echo "تم العثور على project.zip، جاري فك الضغط..." unzip -o project.zip if [ -d "abayazeed_link_manager" ]; then cp -r abayazeed_link_manager/* . fi fi ls -la # 3. إعداد بيئة Java 17 - name: ☕ إعداد بيئة Java 17 uses: actions/setup-java@v4 with: distribution: 'temurin' java-version: '17' cache: 'gradle' # 4. إعداد بيئة Flutter - name: 💙 إعداد بيئة Flutter 3.19.x uses: subosito/flutter-action@v2 with: flutter-version: '3.19.0' channel: 'stable' cache: true # 5. تحميل التبعيات - name: 📦 تحميل الحزم run: | flutter pub get # 6. بناء ملف APK للإنتاج - name: 🔨 تجميع وبناء ملف الـ APK run: | flutter build apk --release # 7. تجهيز ملف الإخراج - name: 🏷️ تجهيز وتسمية ملف الـ APK run: | mkdir -p output_release cp build/app/outputs/flutter-apk/app-release.apk output_release/abayazeed_link_manager_v4.2.apk # 8. رفع ملف الـ APK للتحميل المباشر - name: 📤 رفع ملف الـ APK للتنزيل على الهاتف uses: actions/upload-artifact@v4 with: name: abayazeed-app-apk path: output_release/abayazeed_link_manager_v4.2.apk retention-days: 30