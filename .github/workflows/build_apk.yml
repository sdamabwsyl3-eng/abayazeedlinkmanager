الترويسة وأدوات التوثيق والإجراءات العلوية:

عنوان توثيقي رسمي: «الدليل الفني والتشغيلي لمنظومة Starlink الفضائية و MikroTik RouterOS».
شارات التحقق والمطابقة: إصدار الدليل المعتمد v2.4، ومطابقته الرسمية مع RouterOS v7.14 & Starlink Dish Gen 3.
