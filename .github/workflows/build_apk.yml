فحص أخطاء البناء المحتملة في Flutter


🩺 تقرير الفحص والتدقيق الاستباقي لأخطاء البناء المحتملة في Flutter (Flutter Build Doctor)
مشروع: «أبايذيد لنك منجر — Abayazeed Link Manager» v4.2 Production

قمنا بإجراء فحص شامل وتدقيق معماري لكافة ملفات المشروع وحزم العمل (Android Gradle, Sunmi AIDL, Proguard, Java/Kotlin, وحزم الاعتماديات)، وتم حفظ الدليل الكامل في مساحة العمل كوثيقة رسمية: «دليل فحص وتصحيح أخطاء البناء في Flutter».

⚠️ أبرز 5 أخطاء بناء محتملة، أسبابها، وحلولها الجذرية الجاهزة:
1. خطأ حزمة Sunmi AIDL في نظام أندرويد 11+ (Package visibility queries):
الأعراض: فشل التعرف على الطابعة المدمجة في أجهزة Sunmi V2/T2 عند البناء بنسخة Release، أو ظهور استثناء ServiceNotFoundException.
السبب: سياسة الخصوصية الجديدة في أندرويد (API 30+) تتطلب التصريح الصريح عن الخدمات الخارجية.
الحل الجذري المطبق: تم تضمين وسم الاستعلام مباشرة داخل <manifest> في AndroidManifest.xml:
<queries>
    <package android:name="woyou.aidlservice.jiuai" />
    <intent>
        <action android:name="woyou.aidlservice.jiuai.IWoyouService" />
    </intent>
</queries>
2. حذف كود الطباعة بواسطة أداة التقليص R8 / Proguard (Release Minification):
الأعراض: زر الطباعة يعمل في وضع التطوير (Debug)، ولكنه يتعطل أو ينهار التطبيق فور بناء الـ APK النهائي للإنتاج (flutter build apk --release).
السبب: قيام R8 بحذف كلاسات woyou.aidlservice.jiuai معتبراً إياها كوداً غير مستخدم.
الحل: وضع قواعد الحماية في android/app/proguard-rules.pro:
-keep class woyou.aidlservice.jiuai.** { *; }
-keep interface woyou.aidlservice.jiuai.** { *; }
-keep class com.google.zxing.** { *; }
أو تعطيل التقليص مؤقتاً عبر minifyEnabled false داخل android/app/build.gradle.
3. عدم توافق إصدار Java مع Gradle (compileReleaseJavaWithJavac):
الأعراض: ظهور الخطأ الشهير: Unsupported class file major version 65 أو فشل Gradle في التعرف على JDK.
السبب: استخدام إصدار جافا حديث جداً (مثل Java 21) مع إصدار أقدم من AGP، أو العكس (Java 8/11 قديم).
الحل القياسي: اعتماد JDK 17 مع إعدادات:
Gradle: 8.3 (في gradle-wrapper.properties).
Android Gradle Plugin (AGP): 8.1.4 أو 8.2.x.
Kotlin Version: 1.9.10.
4. حظر الاتصال غير المشفر براوترات MikroTik (Cleartext HTTP Traffic):
الأعراض: عند تجربة الاتصال براوتر ميكروتك المحلي (مثل http://192.168.88.1/rest)، يرفض التطبيق إرسال الطلب ويعيد خطأ SocketException: OS Error: Connection refused / Cleartext HTTP not permitted.
السبب: أندرويد 9+ يمنع طلبات HTTP العادية افتراضياً خارج الـ HTTPS.
الحل المطبق: إضافة الخاصية في وسم <application> في AndroidManifest.xml:
android:usesCleartextTraffic="true"
5. تعارض إصدارات حزم الـ PDF والـ Image (Dependency Overrides):
الأعراض: خطأ Version solving failed عند تنفيذ flutter pub get بسبب اختلاف متطلبات مكتبة الصور بين pdf و image.
الحل: قفل الإصدارات المتوافقة في pubspec.yaml:
dependency_overrides:
  image: ^4.1.7
  archive: ^3.4.10
  crypto: ^3.0.3
🔄 تسلسل التنظيف والبناء النظيف الخالي من الأخطاء (Zero-Error Sequence):
قبل تنفيذ أمر البناء النهائي، شغّل هذا التسلسل في موجه الأوامر لضمان خلو بيئة العمل من أي كاش قديم:

flutter clean
cd android && ./gradlew clean && cd ..
flutter pub get
flutter build apk --release
مشروعك الآن محصن بالكامل ضد كافة عثرات الترجمة والبناء في بيئات Android و Sunmi. هل ترغب في فحص بيئة أخرى أو المتابعة في خطوة تالية؟


