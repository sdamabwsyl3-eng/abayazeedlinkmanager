طريقة بناء وتصدير ملف APK للأندرويد من الحزمة


إليك الدليل العملي والمباشر لخطوات بناء وتصدير ملف تطبيق الأندرويد (**APK**) الجاهز للتثبيت والاستخدام الميداني من حزمة مشروع **«أبايذيد لنك منجر — Abayazeed Link Manager»**: --- ### 1. المتطلبات الأساسية للبيئة (Prerequisites) تأكد من توفر الأدوات التالية على جهازك: - **Flutter SDK**: الإصدار `3.19.0` أو أحدث (`flutter --version`). - **Java JDK**: الإصدار 17 (`openjdk-17`). - **Android Studio / Android SDK**: مثبت مع حزم الـ Build-Tools ومنصات أندرويد الحديثة (API 34). --- ### 2. تجهيز المشروع وتثبيت الاعتماديات افتح الطرفية (Terminal / Command Prompt) داخل مجلد المشروع المفرّغ من الحزمة، ونفّذ الأوامر التالية: ```bash # 1. الدخول لمجلد المشروع cd abayazeed_link_manager # 2. تنظيف الكاش والملفات المؤقتة السابقة flutter clean # 3. جلب وتثبيت جميع الحزم والمكتبات المحددة في pubspec.yaml flutter pub get ``` --- ### 3. التحقق من صلاحيات الأندرويد (`AndroidManifest.xml`) بما أن المنظومة تتصل براوترات **MikroTik** وطابعات البلوتوث والشبكة الحرارية وكاميرا مسح كروت الـ QR، تأكد من وجود الصلاحيات التالية في ملف: `android/app/src/main/AndroidManifest.xml`: ```xml <manifest xmlns:android="http://schemas.android.com/apk/res/android"> <!-- صلاحيات الاتصال بالشبكة والـ REST API والراوتر المحلي --> <uses-permission android:name="android.permission.INTERNET"/> <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/> <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/> <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/> <!-- صلاحيات طابعات البلوتوث المحمولة ESC/POS --> <uses-permission android:name="android.permission.BLUETOOTH" /> <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" /> <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" /> <uses-permission android:name="android.permission.BLUETOOTH_SCAN" /> <!-- صلاحية الكاميرا لمسح رمز الـ QR لكروت الهوتسبوت --> <uses-permission android:name="android.permission.CAMERA" /> <application android:label="أبايذيد لنك منجر" android:usesCleartextTraffic="true" android:icon="@mipmap/ic_launcher"> <!-- ... --> </application> </manifest> ``` > **ملاحظة:** إضافة `android:usesCleartextTraffic="true"` ضرورية للسماح بالاتصال مع راوترات ميكروتك المحلية عبر بروتوكول `http://` غير المشفر داخل الشبكة المحلية. --- ### 4. خيارات بناء وتصدير ملف الـ APK (Build Commands) #### الخيار أ: بناء ملف APK شامل لجميع المعالجات (Universal Release APK) هذا هو الخيار الأسهل لنقل الملف بالبلوتوث أو واتساب وتثبيته على أي هاتف أو جهاز نقطة بيع (Sunmi / POS): ```bash flutter build apk --release ``` - **مسار الملف الناتج:** `build/app/outputs/flutter-apk/app-release.apk` --- #### الخيار ب: بناء حزم مجزأة ومحسنة بحسب نوع المعالج (Split APKs - حجم أصغر وأداء أسرع) يقوم هذا الأمر بإنشاء ملف منفصل لكل معمارية (مثل معالجات الهواتف الحديثة `arm64-v8a` أو الأجهزة الأقدم `armeabi-v7a`) مما يقلل حجم التطبيق إلى النصف تقريباً: ```bash flutter build apk --release --split-per-abi ``` - **الملفات الناتجة:** - `build/app/outputs/flutter-apk/app-arm64-v8a-release.apk` (للهواتف الحديثة - مستحسن). - `build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk` (للأجهزة الاقتصادية وطابعات نقاط البيع القديمة). --- #### الخيار ج: تصدير حزمة متجر Google Play (AAB - Android App Bundle) إذا كنت تخطط لرفع التطبيق على متجر Google Play Console: ```bash flutter build appbundle --release ``` - **مسار الملف الناتج:** `build/app/outputs/bundle/release/app-release.aab` --- ### 5. خطوات التثبيت والتشغيل على الهاتف أو جهاز الـ POS 1. انسخ ملف `app-release.apk` إلى ذاكرة الهاتف أو جهاز كاشير الـ POS. 2. افتح مدير الملفات واضغط على التطبيق للتثبيت. 3. فعّل خيار **«السماح بالتثبيت من مصادر غير معروفة (Install from unknown sources)»** عند المطالبة. 4. افتح تطبيق **أبايذيد لنك منجر** وسيعمل فوراً بالواجهة العربية الكاملة وبالثيم الليلي السيبراني المعتمد. هل ترغب في توضيح كيفية توقيع التطبيق بمفتاح Keystore رسمي للإنتاج، أو تفاصيل ربط طابعة Sunmi عبر الـ APK؟

دليل ربط طابعات Sunmi المدمجة مع تطبيق الأندرويد


تم بنجاح إعداد وتوثيق دليل ربط وتكامل طابعات Sunmi المدمجة مع تطبيق الأندرويد (Flutter) لمنظومة «أبايذيد لنك منجر — Abayazeed Link Manager» وحفظه كمستند رسمي ومباشر داخل مساحة العمل.

محاور دليل ربط أجهزة وطابعات Sunmi المدمجة:
فهم آلية عمل أجهزة Sunmi (Sunmi AIDL vs Traditional Bluetooth):

تعمل أجهزة نقاط البيع الذكية (Sunmi V2, V2 Pro, V2s, T2 Mini) عبر خدمة نظام داخلية (woyou.aidlservice.jiuai) توفر سرعة استجابة فائقة (Zero Latency) بدون الحاجة للاقتران التقليدي عبر البلوتوث.
الاعتماديات اللازمة (pubspec.yaml):

حزمة sunmi_printer_plus: ^2.1.2 المسؤولة عن التواصل مع الطابعة الداخلية، القص الآلي، والتحكم بمحاذاة الرول.
حزمة qr_flutter و image لمعالجة الصور والشعارات النقطية.
إعدادات الصلاحيات في ملف الأندرويد (AndroidManifest.xml):

إضافة إذن الطباعة المباشرة: <uses-permission android:name="woyou.aidlservice.jiuai.permission.PrinteDirect"/>
إضافة إعلان حزمة خدمة أجهزة Sunmi داخل وسم <queries> المتوافق مع أندرويد 11 فما فوق (API 30+).
خدمة التكامل البرمجية الكاملة (sunmi_printer_service.dart):

تهيئة وربط الطابعة التلقائي (SunmiPrinter.bindingPrinter()).
فحص حالة الطابعة والورق لتفادي أخطاء نفاد الرول (PrinterStatus.OUT_OF_PAPER).
تفعيل وضع المعاملة الواحدة المجمعة (Transaction Print Mode) لطباعة الكرت كاملاً بضغطة واحدة وتجنب تقطع السطور.
طباعة الشعار والعلامة التجارية، اسم الباقة، السعر، الحصة والصلاحية.
طباعة رمز الـ QR السريع للدخول التلقائي مع ضبط مستوى تصحيح الأخطاء العالي (QRErrorLevel.H).
طباعة بيانات تسجيل الدخول اليدوي (اسم المستخدم + رمز الـ PIN).
طباعة الباركود الخطي (Code128) لمسدسات الكاشير.
إعطاء أمر القص الآلي للورق (SunmiPrinter.cut()) لأجهزة V2 Pro و T2.
كود ربط زر الطباعة داخل شاشات التطبيق:

كود استدعاء تفاعلي مدمج مع التنبيهات (SnackBar) للتأكد من جاهزية الورق قبل الطباعة.
إرشادات المقاسات الميدانية (58mm مقابل 80mm):

ضبط أبعاد الـ QR والباركود لتناسب قياس 58mm في الأجهزة المحمولة مثل Sunmi V2 دون تجاوز حدود الرول.
المستند متوفر بالكامل الآن في مساحة العمل ويمكن نسخه وتطبيقه مباشرة في المشروع.


