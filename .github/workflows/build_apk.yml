توليد لوحة التحكم الرئيسية (Dashboard) المتوافقة مع نظام التصميم


تم بنجاح تصميم وتوليد لوحة التحكم الرئيسية (Dashboard) لتطبيق «شبكتك تحت السيطرة — Starlink & MikroTik Manager» متوافقة تماماً مع نظام التصميم المعتمد وباللغة العربية (RTL).

أبرز مكونات وميزات لوحة التحكم:
شريط الحالة والعمليات السريعة:

شارة الاتصال الفوري بـ MikroTik CCR2004 وهوائي Starlink Gen 3 مع مؤشر نبضي لمعدل المزامنة (كل 5 ثوانٍ).
أزرار سريعة لتوليد كروت جديدة، إعادة مزامنة الـ API، والتقارير اليومية.
بطاقات المؤشرات الحيوية (KPI Cards):

سرعة ومؤشرات Starlink WAN: قياس فوري لمعدل التحميل (218.4 Mbps)، الرفع (34.8 Mbps)، وزمن الاستجابة (Ping 28 ms).
المشتركون النشطون: 142 جهاز متصل في الوقت الفعلي مع نسبة الإشغال.
مبيعات واستهلاك اليوم: إحصائية الكروت المباعة، الإيراد المالي، وإجمالي حركة البيانات.
جودة إشارة الطبق الفضائي: نسبة نقاء الإشارة (99.4%)، والعوائق (0.0%).
الرسوم البيانية والمراقبة المباشرة:

مخطط حركة نقل البيانات اللحظي (Traffic Flow) للتحميل والرفع عبر واجهات الموجه.
مخطط دائري لتوزيع باقات وكروت الهوتسبوت النشطة (ساعات، يومية، أسبوعية، وشهرية).
مراقبة العتاد والأجهزة (Hardware Telemetry):

MikroTik RouterOS: مراقبة المعالج (CPU 18%)، الذاكرة (RAM 42%)، درجة الحرارة (41°C)، وحالة المنافذ الشبكية (ether1 to ether5).
Starlink Standard: زاوية السمت والارتفاع (62.4°)، استهلاك الطاقة (65.2W)، حالة إذابة الثلوج.
جلسات المشتركين وسجل الأحداث الحي:

جدول تفصيلي للمشتركين المتصلين لحظياً مع كود الكرت، الـ IP/MAC، نقطة البث، حجم البيانات المستهلكة، والوقت المتبقي مع إجراءات الفصل والتحكم.
سجل مباشر لتدفق أحداث النظام والتنبيهات.

