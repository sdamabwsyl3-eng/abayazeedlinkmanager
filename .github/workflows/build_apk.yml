تمت مراجعة المنظومة وتدقيق كافة الأركان التشغيلية والبرمجية لمشروع «أبايذيد لنك منجر — Abayazeed Link Manager» لإدارة وتوزيع شبكات Starlink الفضائية وMikroTik RouterOS.

جميع الشاشات، الأدوات، قوالب الطباعة، والمواصفات البرمجية متوفرة بالكامل وجاهزة للاستخدام:

1. المنظومة الإدارية وغرفة العمليات المركزية (Web & Desktop Dashboard):
لوحة التحكم المركزية (Dashboard): مؤشرات الترافيك اللحظي، تدفق الأقمار، والجلسات النشطة وسجل الأحداث.
غرفة العمليات والطوبولوجيا الحية (Live NOC Topology): المخطط الشبكي التفاعلي للأبراج (المنصور، اليرموك، عقدة الألياف) مع رادار كوكبة أقمار Starlink وحالة FastTrack.
إدارة الكروت وتوليد الفئات (Vouchers & Batch Management): توليد دفعات الكروت، تحديد السرعات والحصص، والمزامنة المباشرة مع RouterOS User Manager.
نافذة منبثقة تفاعلية لعرض وطباعة كروت الفئة (Print Modal): فحص الكروت المولدة وخيارات الطباعة الفورية والفردية.
استوديو ومحرر تخصيص الكروت (Visual Card Designer): التحكم في مقاسات الكروت، الشعارات، الألوان، ومواضع الـ QR والباركود.
قالب طباعة شبكة كروت A4 (Sheet Printing 18 Cards): شبكة كروت جاهزة للطباعة الورقية مع خطوط وهوامش القص 3mm وعلامات التخليص.
محرك ومعاين الطباعة الحرارية 80mm لنقاط البيع (ESC/POS Thermal Engine): محاكاة رول الكاشير الحراري 80mm، مفتش أوامر البايتات الخام Hex/ASCII، وبروفايلات طابعات Sunmi, Xprinter, Epson, Bixolon.
المشتركون النشطون وإدارة الجلسات (Active Subscribers): جدول الجلسات الحية، استهلاك الباندوث لحظياً، وعمليات الطرد/الفصل السريع (Kick / Disconnect).
وكلاء التوزيع ونقاط البيع الميدانية (Agents & POS): متابعة مستودعات الكروت، أرصدة الذمم والديون، أجهزة POS الذكية، وتوليد إيصالات التسليم.
سجل العمليات والتدقيق الأمني المباشر (Syslog Stream & Audit Logs): بث مباشر لأحداث الراوتر وجدار الحماية MikroTik Firewall ورصد محاولات الاختراق.
إعدادات العتاد و MikroTik وموجه الأوامر (Terminal Console): تكوين الراوتر، منافذ SFP+ و Ethernet، وفحص الأوامر في بيئة تجريبية Dry-Run قبل التنفيذ.
التحليلات والتقارير المالية والشبكية (Analytics & Reports): رسوم بيانية لحجم الترافيك اليومي والشهري، الإيرادات المالية، ومعدل استقرار اتصال Starlink.
الدليل الفني والتشغيلي المدمج (Technical Manual): توثيق شامل للربط الشبكي وأوامر الـ CLI وأكواد الـ REST API.
بوابة تسجيل الدخول الإدارية (NOC Admin Login): تسجيل دخول سيبراني مشفر بمعيار AES-256 مع فحص اتصال راوتر الكور والأقمار.
2. باقة بوابة المشترك المحمولة (Mobile Hotspot Captive Portal Suite):
صفحة تسجيل الدخول للهوتسبوت (Captive Portal Login): واجهة مخصصة للهواتف مع قارئ QR مدمج وحقول إدخال الكرت والـ PIN، وزر دعم واتساب.
شاشة حالة الاتصال والوقت المتبقي (Hotspot Status / Connected Screen): عداد رقمي للوقت المتبقي، استهلاك البيانات، مؤشر سرعة الاتصال، وزر إنهاء الجلسة.
شاشة انتهاء الرصيد أو الصلاحية (Session Expired Screen): تنبيه استنفاد الحصة، خيارات شحن رصيد جديد، وأزرار التواصل السريع مع أقرب وكيل.
3. الحزم البرمجية والأكواد المصدرية الجاهزة للتنفيذ (Code & Architecture Docs):
ملف كود Dart المصدري لمحرك ESC/POS الحراري: متاح ومحفوظ بالكامل وجاهز للربط عبر البلوتوث أو شبكة الـ LAN على المنفذ 9100.
