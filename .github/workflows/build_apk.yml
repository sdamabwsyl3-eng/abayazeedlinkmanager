تم بنجاح إنشاء وتحديث نظام التصميم لتطبيق «شبكتك تحت السيطرة — Starlink & MikroTik Manager» بناءً على الملفات المرفقة (ملف الدليل، README.md، و DESIGN.md).

أبرز ملامح نظام التصميم:
النمط البصري (Theme):
واجهة ليلية تقنية احترافية (Modern Dark Mode) تلائم غرف المراقبة ومسؤولي شبكات الأبراج والألياف/الأقمار الصناعية.
تباين عالٍ مريح للعين مع أسطح داكنة متدرجة (surface, surface-container).
لوحة الألوان المستوحاة من Starlink و MikroTik:
اللون الأساسي الفيروزي التقني / السيان (#00e5ff): مؤشرات التردد والاتصال الفضائي والبيانات الحية.
اللون الثانوي والأزرق الميكروتي: للتنقل والتحكم والعمليات المتقدمة.
ألوان المؤشرات الوظيفية (Semantic Colors): أخضر ناصع لحالة الأجهزة والمشتركين النشطين (Active Online)، برتقالي للتحذيرات وانخفاض الإشارة، وأحمر للانقطاع والإنذارات.
الطباعة ودعم العربية (RTL First):
خط IBM Plex Sans Arabic لضمان وضوح الأرقام الفنية (IPs, MAC addresses, Throughput Mbps, Ping ms) ومقروئية النصوص والمصطلحات الشبكية.
المكونات والأنماط التفاعلية:
بطاقات إحصائيات لمعدل نقل البيانات (Download/Upload)، عدادات المستخدمين النشطين، فئات كروت الهوتسبوت (Hotspot & User Manager)، وجداول مراقبة الرواتر والأطباق.
نظام التصميم متاح الآن ومُعتمد في مساحة العمل لتوليد شاشات التطبيق المتناسقة معه.


