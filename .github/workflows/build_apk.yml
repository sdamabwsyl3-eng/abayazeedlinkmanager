أو عبر فلاشة / واتساب / تيليجرام: أرسل الملف للهاتف واضغط تثبيت.
2️⃣ الاتصال بالشبكة المحلية للراوتر (LAN / Wi-Fi):
تأكد أن هاتفك أو جهاز Sunmi متصل بنفس شبكة الـ Wi-Fi التابعة لراوتر MikroTik أو سويتش التوزيع.
افتح التطبيق؛ ستظهر شاشة تسجيل الدخول الموحدة بثيمها السيبراني الداكن.
3️⃣ ربط الراوتر وتفعيل الاتصال الحي (Live Sync):
ادخل إلى شاشة «إعدادات العتاد و MikroTik».
أدخل بيانات راوترك:
عنوان المضيف (Host IP): الـ IP المحلي للراوتر (مثلاً: 192.168.88.1).
المنفذ (Port): 80 (أو 443 إذا كنت مفعلاً SSL).
المستخدم وكلمة المرور: بيانات المستخدم الذي تم إنشاؤه بصلاحيات rest و api.
اضغط زر «فحص ومزامنة الاتصال (Test & Sync)»:
ستتحول شارة الحالة في الشريط العلوي فوراً من OFFLINE إلى ONLINE باللون السيبراني المشع (#00e5ff).
ستلاحظ تدفق بيانات ترافيك منافذ Starlink SFP وجلسات المشتركين الحالية لحظياً.
4️⃣ توليد أول كرت فعلي وحقنه في الراوتر (Voucher Injection):
انتقل إلى شاشة «إدارة الكروت والفئات».
اختر فئة «24 ساعة توربو» أو أي باقة مفضلة لديك.
اضغط على زر «توليد دفعة جديدة (Generate Batch)»:
سيقوم التطبيق بإنشاء الكروت وإرسال طلب PUT /ip/hotspot/user إلى راوتر MikroTik تلقائياً.
يمكنك فتح برنامج WinBox على كمبيوترك والتأكد من ظهور المستخدمين الجدد فوراً في قائمة IP > Hotspot > Users.
5️⃣ اختبار الطباعة الحرارية الميدانية (Thermal Print Test):
داخل شاشة الكروت، اضغط على زر «طباعة فورية على Sunmi» (أو طابعة ESC/POS الحرارية):
سيتعرف التطبيق فوراً على الطابعة المدمجة في أجهزة Sunmi أو طابعة البلوتوث/الشبكة.
ستخرج التذكرة الحرارية مطبوعة بدقة عالية تتضمن:
شعار وهوية المنظومة.
باركود خطي Code128 لمسدس الكاشير.
رمز QR الذكي للدخول التلقائي السريع.
تنفيذ أمر القص الآلي للورق (Auto-Cut).
6️⃣ تجربة المشترك النهائي (End-User Experience):
خذ هاتف تجارب متصلاً بشبكة الـ Wi-Fi للهوتسبوت.
افتح الكاميرا وامسح رمز الـ QR المطبوع على الكرت:
سيفتح الرابط التلقائي المباشر: http://hotspot.abayazeed.net/login?user=...&pin=....
سيتم تسجيل الدخول الفوري دون الحاجة لكتابة الأرقام يدوياً.
سينتقل هاتف المشترك إلى شاشة حالة الاتصال والوقت المتبقي.
ارجع لشاشة «غرفة العمليات والطوبولوجيا الحية (NOC)» في هاتفك أو لوحة التحكم:
ستشاهد المشترك الجديد ظاهراً في جدول الجلسات النشطة مع قراءة الـ IP والـ MAC واستهلاك الباندويث المباشر.
🎯 المنظومة الآن تعمل بكامل طاقتها على أرض الواقع!
هل ترغب في فحص أي قراءة محددة، مراجعة استجابة ميزة معينة أثناء تجربتك، أو تخصيص أي تفاصيل إضافية؟


اكيف اقوم بتنزيل التطبيق وتثبيته في هاتفي الذي اعمل به الآن


لتنزيل وتثبيت تطبيق «أبايذيد لنك منجر — Abayazeed Link Manager» مباشرة على هاتفك الأندرويد الذي تعمل به الآن، إليك أسهل وأسرع الطرق العملية المباشرة:

🚀 الطريقة الأولى: استلام وتثبيت ملف الـ APK مباشرة على الهاتف (الأسهل والأسرع)
إذا قمت ببناء ملف الـ APK النهائي من المشروع على جهاز الكمبيوتر:

موقع ملف التطبيق بعد البناء:

عند تنفيذ أمر البناء في جهازك:
flutter build apk --release
ستجد ملف التطبيق جاهزاً في هذا المسار داخل مجلد المشروع:
build/app/outputs/flutter-apk/app-release.apk
إرسال الملف إلى هاتفك الحالي:

عبر واتساب أو تيليجرام (Saved Messages): أرسل ملف app-release.apk لنفسك أو عبر واتساب ويب وافتحه من الهاتف.
عبر Google Drive أو أي سحابة: ارفع الملف وافتحه من تطبيق درايف على هاتفك ثم اضغط تنزيل.
عبر كابل USB أو فلاشة OTG: انسخ الملف مباشرة إلى مجلد التنزيلات (Downloads) في هاتفك.
التثبيت على الهاتف:

افتح تطبيق مدير الملفات (Files / File Manager) في هاتفك واضغط على ملف app-release.apk.
إذا ظهرت لك رسالة أمان: «غير مسموح بتثبيت تطبيقات من هذا المصدر»:
اضغط على الإعدادات (Settings).
فعّل خيار «السماح بالتثبيت من هذا المصدر (Allow from this source)».
اضغط على تثبيت (Install).
سيظهر التطبيق فوراً على شاشة هاتفك بأيقونته وهويته الكاملة.
⚡ الطريقة الثانية: التثبيت الفوري عبر كابل الكمبيوتر (ADB Direct Install)
إذا كان هاتفك موصولاً بالكمبيوتر عبر كابل الشحن (USB):

ادخل إلى إعدادات هاتفك (Settings) > حول الهاتف (About Phone).
اضغط على رقم الإصدار (Build Number) 7 مرات متتالية حتى تظهر عبارة «أنت الآن في وضع المطور».
افتح خيارات المطور (Developer Options) وفعّل:
تصحيح أخطاء USB (USB Debugging).
افتح الطرفية (Terminal / PowerShell) في كمبيوترك ونفّذ الأمر التالي:
adb install -r build/app/outputs/flutter-apk/app-release.apk
سيتم تثبيت التطبيق على هاتفك تلقائياً خلال 3 ثوانٍ دون الحاجة لنقل أي ملفات يدوياً.
🌐 الطريقة الثالثة: فتح نسخة الويب التجريبية فوراً من متصفح هاتفك
إذا كنت تريد تجربة الواجهات والشاشات فوراً من متصفح Chrome في هاتفك دون انتظار بناء ملف APK:

نفّذ في جهازك أمر تشغيل نسخة الويب على شبكتك المحلية:
flutter run -d web-server --web-hostname 0.0.0.0 --web-port 8080
افتح متصفح Chrome في هاتفك (المتصل بنفس شبكة الـ Wi-Fi) واكتب عنوان IP كمبيوترك:
http://192.168.1.XX:8080
ستفتح الواجهة كاملة وتعمل كتطبيق ويب تقدمي (PWA) يمكنك إضافته للشاشة الرئيسية.
📋 أول خطوة بعد فتح التطبيق على هاتفك:
تأكد أن هاتفك متصل بشبكة الـ Wi-Fi الخاصة براوتر MikroTik.
افتح شاشة «إعدادات العتاد و MikroTik»، وضع IP الراوتر (مثل 192.168.88.1) واسم المستخدم وكلمة المرور واضغط «فحص ومزامنة الاتصال» لتتحول الشارة إلى ONLINE وتبدأ بإدارة شبكتك مباشرة.

