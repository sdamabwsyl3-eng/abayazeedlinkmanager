f8.encode('$username:$password'))}', 'Content-Type': 'application/json', }, connectTimeout: const Duration(seconds: 5), receiveTimeout: const Duration(seconds: 10), )); /// جلب الجلسات النشطة في الهوتسبوت Future<List<Map<String, dynamic>>> getActiveSessions() async { final res = await _dio.get('/ip/hotspot/active'); return List<Map<String, dynamic>>.from(res.data); } /// حقن كرت هوتسبوت جديد داخل الراوتر Future<void> addVoucherUser({ required String username, required String password, required String profile, String? comment, }) async { await _dio.put('/ip/hotspot/user', data: { 'name': username, 'password': password, 'profile': profile, 'comment': comment ?? 'Abayazeed-Batch', }); } /// فصل مستخدم (Kick) Future<void> disconnectSession(String sessionId) async { await _dio.delete('/ip/hotspot/active/$sessionId'); } /// معلومات العتاد والذاكرة Future<Map<String, dynamic>> getSystemResource() async { final res = await _dio.get('/system/resource'); return Map<String, dynamic>.from(res.data); } } ``` --- ### 5. محرك طباعة طابعات Sunmi المدمجة مع وضع المحاكاة: `lib/core/utils/sunmi_printer_service.dart` ```dart import 'package:flutter/material.dart'; import 'package:sunmi_printer_plus/enums.dart'; import 'package:sunmi_printer_plus/sunmi_printer_plus.dart'; import 'package:sunmi_printer_plus/sunmi_style.dart'; class SunmiVoucherData { final String username; final String pin; final String packageName; final double price; final String currency; final String validity; final String quota; final String batchCode; SunmiVoucherData({ required this.username, required this.pin, required this.packageName, required this.price, this.currency = 'د.ع', required this.validity, required this.quota, required this.batchCode, }); String get loginUrl => 'http://hotspot.abayazeed.net/login?user=$username&pin=$pin'; } class SunmiPrinterService { static bool _isBound = false; static bool _isEmulatorMode = false; static Future<bool> initialize() async { try { final bool? isBound = await SunmiPri