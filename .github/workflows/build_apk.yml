```yaml name: 🚀 Build & Release Abayazeed Link Manager APK on: push: branches: - main - master workflow_dispatch: jobs: build-apk: name: 🏗️ بناء ملف APK عبر خوادم GitHub السحابية runs-on: ubuntu-latest timeout-minutes: 25 steps: - name: 📥 جلب كود المشروع (Checkout Repository) uses: actions/checkout@v4 - name: ☕ إعداد بيئة Java 17 uses: actions/setup-java@v4 with: distribution: 'temurin' java-version: '17' cache: 'gradle' - name: 💙 إعداد بيئة Flutter 3.19.x uses: subosito/flutter-action@v2 with: flutter-version: '3.19.0' channel: 'stable' cache: true - name: 📦 تحميل حزم pubspec.yaml run: | flutter pub get - name: 🔨 تجميع وبناء ملف الـ APK run: | flutter build apk --release - name: 🏷️ تجهيز وتسمية ملف الـ APK run: | mkdir -p output_release cp build/app/outputs/flutter-apk/app-release.apk output_release/abayazeed_link_manager.apk - name: 📤 رفع ملف الـ APK للتحميل المباشر من الهاتف (Upload Artifact) uses: actions/upload-artifact@v4 with: name: abayazeed-link-manager-apk path: output_release/abayazeed_link_manager.apk retention-days: 30 - name: 🚀 إنشاء إصدار GitHub Release قابل للتنزيل uses: softprops/action-gh-release@v2 if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push' with: tag_name: v1.0.${{ github.run_number }} name: "تطبيق أبايذيد لنك منجر APK (Build #${{ github.run_number }})" files: output_release/abayazeed_link_manager.apk env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} ```
