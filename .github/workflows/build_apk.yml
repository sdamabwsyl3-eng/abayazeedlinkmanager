خطوات تجهيز ملف APK لتثبيته على أجهزة Sunmi الفعلية


تم إعداد وتوثيق الدليل الهندسي والتشغيلي المتكامل لـ «خطوات تجهيز وبناء ملف APK لتثبيته وتشغيله على أجهزة Sunmi الفعلية (POS & Handheld)» وحفظه كمستند رسمي في مساحة العمل (دليل تجهيز وبناء APK لأجهزة Sunmi الفعلية).

ملخص الخطوات العملية لبناء وتثبيت الـ APK على أجهزة Sunmi:
1. التحقق من إعدادات مشروع الأندرويد:
minSdkVersion 21 و targetSdkVersion 33: لضمان عمل التطبيق على أجهزة Sunmi القديمة (Android 7.1) والحديثة (Android 10/11/12).
صلاحية الطابعة المدمجة في AndroidManifest.xml:
<uses-permission android:name="woyou.aidlservice.jiuai.permission.PrinteDirect" />
إعلان خدمة Sunmi AIDL للأندرويد الحديث:
<queries>
    <package android:name="woyou.aidlservice.jiuai" />
    <intent>
        <action android:name="woyou.aidlservice.jiuai.IWoyouService" />
    </intent>
</queries>
السماح بحركة المرور غير المشفرة: android:usesCleartextTraffic="true" لتمكين الاتصال المباشر براوترات MikroTik المحلية عبر HTTP.
2. أوامر بناء الـ APK:
الخيار المستحسن (Universal APK):
flutter build apk --release
ينتج ملف: build/app/outputs/flutter-apk/app-release.apk، متوافق مع كافة موديلات أجهزة Sunmi (32-bit و 64-bit).
الخيار المخصص للأجهزة الاقتصادية (32-bit ARM):
flutter build apk --release --target-platform android-arm
أخف وزناً وأسرع استجابة على أجهزة Sunmi V2 المحمولة.
3. طرق التثبيت على جهاز Sunmi الفعلي:
عبر كابل USB و ADB (المباشر والسريع):
تفعيل USB Debugging في خيارات المطور بجهاز Sunmi.
تشغيل: adb install -r build/app/outputs/flutter-apk/app-release.apk.
عبر فلاشة USB أو كرت ذاكرة (OTG):
نسخ ملف الـ APK وتثبيته عبر تطبيق File Manager المدمج في Sunmi.
التثبيت الجماعي عن بُعد (Sunmi Partner Cloud):
رفع الملف لمنصة partner.sunmi.com ودفع التحديث أوتوماتيكياً لأجهزة ونقاط بيع الموزعين.
4. قائمة الفحص بعد التثبيت (Post-Check):
ارتباط خدمة AIDL woyou.aidlservice.jiuai فور تشغيل التطبيق.
فحص جهوزية رول الورق SunmiPrinter.getStatus().
اختبار طباعة كرت تجريبي متضمناً شعار المنظومة، الـ QR السريع، الباركود الخطي، وأمر القص الآلي cut().

