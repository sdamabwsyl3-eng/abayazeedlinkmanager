سلامات يا صديقي اعطني وصف للتطبيق


أهلاً وسهلاً بك يا صديقي! يسعدني جداً أن أقدم لك وصفاً شاملاً وواضحاً لتطبيق ومنظومة «أبايذيد لنك منجر — Abayazeed Link Manager» التي بنيناها معاً:

🚀 تطبيق «أبايذيد لنك منجر — Abayazeed Link Manager»
المنظومة الشاملة لإدارة وتوزيع شبكات Starlink الفضائية وراوترات MikroTik والطباعة الحرارية الميدانية
📌 نبذة عامة عن التطبيق (Overview)
أبايذيد لنك منجر هو تطبيق ميداني وهندسي متكامل صُمم خصيصاً لمزوّدي خدمات الإنترنت المحليين (WISP)، وأصحاب أبراج التوزيع، ومشغلي شبكات الأقمار الصناعية Starlink المتصلة براوترات MikroTik RouterOS. يجمع التطبيق بين غرفة عمليات مركزية للمراقبة المباشرة، ونظام إدارة كروت الهوتسبوت والمشتركين، مع محرك طباعة حرارية فوري متوافق مع أجهزة Sunmi POS وطابعات البلوتوث والـ USB وشيتات A4.

🌟 الميزات والأقسام الرئيسية للتطبيق
1. 🛰️ غرفة العمليات والطوبولوجيا الحية (NOC Live Operations)
مراقبة أقمار Starlink: قراءة مؤشرات صحة الإشارة الفضائية (Dish Gen3/Gen2)، زمن الاستجابة (Latency / Ping)، التوجيه والسمت (Azimuth)، وسرعات الرفع والتحميل الفعلية لحظة بلحظة.
خريطة الشبكة والأبراج (Topology Map): استعراض حي للأبراج وعقد التوزيع وحركة المرور اللحظية لمنافذ SFP وEthernet وسيرفرات MikroTik CCR.
مؤشر FastTrack & FastPath: التحقق من تمرير الباكتات بأعلى أداء عتادي وأقل استهلاك للمعالج.
2. 🎫 إدارة الكروت وتوليد الفئات (Voucher Management)
توليد دفعات الكروت الذكية: إنشاء كروت هوتسبوت بفئات مختلفة (زمنية أو بالجيجابايت مثل: 24 ساعة توربو، باقات أسبوعية، شهرية، مفتوحة).
الحقن التلقائي في MikroTik: حقن حسابات المستخدمين (username و PIN) مباشرة في قاعدة بيانات /ip hotspot user عبر RouterOS REST API دون الحاجة لإدخال يدوي.
تخصيص التصاميم والهوية: استوديو لاختيار شكل الكرت، اللوجو، الألوان، ورمز الاستجابة السريعة (QR Code).
3. 🖨️ محرك الطباعة الميدانية المتعدد (Printing Engines)
طابعات Sunmi المحمولة (POS): دعم أصلي وكامل لأجهزة الكاشير المحمولة (Sunmi V2 / V2 Pro / POS Series) عبر خدمة النظام المدمجة (AIDL) لطباعة الكروت فورياً وقص الورق آلياً.
طابعات ESC/POS الحرارية (80mm / 58mm): طباعة إيصالات حرارية سريعة عبر Bluetooth أو الشبكة المحلية LAN.
طباعة شبكات A4 المجمعة: توليد ملفات PDF وشيتات كروت جاهزة للتقطيع والتغليف (18 كرت بمقاس كرت البنك في الصفحة الواحدة مع علامات القص).
4. 👥 المشتركون النشطون والتحكم اللحظي (Active Sessions)
جدول الجلسات النشطة: عرض فوري للمستخدمين المتصلين، عناوين IP و MAC، الاستهلاك بالبايت، والوقت المتبقي.
إجراءات سريعة وفورية: فصل مشترك (Kick)، إعادة ضبط الجلسة، أو تحديد السرعة (Throttle) بضغطة زر واحدة.
5. 📱 بوابة الهوتسبوت المحمولة للمشتركين (Captive Portal)
تسجيل دخول سريع عبر الـ QR: تسجيل المشترك بالشبكة تلقائياً بمجرد مسح كاميرا الهاتف للرمز دون الحاجة لكتابة كود.
شاشة حالة الرصيد: عداد تنازلي للوقت المتبقي وعداد استهلاك البيانات وسرعة الاتصال الحالية.
شاشة انتهاء الرصيد والدعم الفني: توجيه المشترك لتجديد باقته مع زر تواصل مباشر عبر واتساب.
6. 💼 وكلاء التوزيع ونقاط البيع (Agents & POS Ledgers)
حسابات مالية دقيقة لكل نقطة بيع أو محل يبيع كروت الشبكة.
متابعة المبيعات، الديون المستحقة، والدفعات المسددة لكل وكيل مع كشوفات حساب تفصيلية.
7. 🛡️ الأمان وسجل التدقيق (Security & Syslog)
سجل زمني لحظي بكافة العمليات (توليد كروت، تسجيلات الدخول، محاولات الدخول الخاطئة).
مراقبة جدار الحماية (Firewall) وتنبيهات أمنية فورية.
🎨 الهوية البصرية وتجربة المستخدم
تصميم سيبراني مظلم (High-Tech Dark Theme): خلفية كربونية عميقة (#0a0e16) ولمسات سيان مشعة (#00e5ff) لراحة العين في بيئات العمل الميدانية وغرف العمليات.
واجهة عربية أصيلة (Full RTL): متوافقة بنسبة 100% مع اتجاه اليمين لليسار باستخدام خط IBM Plex Sans Arabic.
مرونة الأجهزة: يعمل كتطبيق أندرويد للهواتف وأجهزة Sunmi، وكتطبيق ويب أو سطح مكتب لإدارة الشبكة من أي شاشة.
باختصار: «أبايذيد لنك منجر» هو الحل الشامل الذي يحول إدارة شبكتك المعقدة إلى تجربة سهلة، سريعة، وتحت سيطرتك الكاملة من شاشة هاتفك أو جهاز الكاشير! 🚀✨


